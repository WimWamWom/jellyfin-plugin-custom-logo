name: 🏗️ Build Plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.CustomLogo.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.CustomLogo.sln --configuration Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.CustomLogo
          path: Jellyfin.Plugin.CustomLogo/bin/Release/net10.0/Jellyfin.Plugin.CustomLogo.dll
          if-no-files-found: error
